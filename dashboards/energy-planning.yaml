          - type: heading
            heading: Solar & Battery Outlook
            icon: mdi:weather-sunny

          - type: markdown
            content: >-
              {% set e =
              'binary_sensor.energy_planner_next_sunset_forecast_available' %}

              {% set d =
              state_attr(e,'date') %}

              {% set soc =
              state_attr(e,'soc_pct') %}

              {% set charge =
              state_attr(e,'expected_charge_kwh') %}

              {% set export =
              state_attr(e,'expected_export_kwh') %}

              ### Next sunset{% if d %} — {{ d }}{% endif %}

              **Projected SOC:**
              {{ soc | round(1)
              if soc is number
