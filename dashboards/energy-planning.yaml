# Energy Planning dashboard v3
#
# Decision-first Lovelace dashboard for Energy Planner v0.1.17.
# The primary question is whether stationary-battery headroom will be exhausted
# before the available solar can be kept onsite.

views:
  - title: Energy Planning
    path: energy-planning
    icon: mdi:solar-power
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Headroom Decision
            icon: mdi:battery-alert-variant-outline

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_headroom_risk_today' %}
              {% set status = state_attr(e,'status') %}
              {% set shortfall = state_attr(e,'shortfall_kwh') %}
              {% set export = state_attr(e,'capacity_export_kwh') %}
              {% set action = state_attr(e,'action') %}
              {% set scale = state_attr(e,'current_day_scale_factor') %}
              {% set source = state_attr(e,'forecast_source') %}
              {% if is_state(e,'on') %}
              ## ⚠️ HEADROOM RISK — TODAY
              **Projected storage shortfall:** {{ shortfall | round(1) if shortfall is number else '—' }} kWh  
              **Capacity-limited export if no useful load is added:** {{ export | round(1) if export is number else '—' }} kWh  
              **Action:** {{ action or 'Use useful flexible load before the battery fills.' }}
              {% elif status == 'risk_future' %}
              ## 🟡 HEADROOM RISK — FUTURE
              **First risk day:** {{ state_attr(e,'risk_date') or '—' }}  
              {{ action or 'Preserve flexible-load capacity for the risk day.' }}
              {% else %}
              ## 🟢 NO MATERIAL HEADROOM RISK
              {{ action or 'No headroom action is currently required.' }}
              {% endif %}
              
              Forecast basis: **{{ source or 'unavailable' }}**{% if scale is number %} · current-day scale **{{ scale | round(2) }}×**{% endif %}

          - type: tile
            entity: binary_sensor.energy_planner_headroom_risk_today
            name: Headroom Risk Today
            icon: mdi:battery-alert
            vertical: false

          - type: tile
            entity: sensor.energy_planner_whole_bank_soc
            name: Battery Now
            icon: mdi:battery
            vertical: false

          - type: tile
            entity: sensor.energy_planner_battery_headroom
            name: Battery Headroom
            icon: mdi:battery-plus-outline
            vertical: false

          - type: tile
            entity: sensor.energy_planner_rolling_headroom_shortfall
            name: Modeled Headroom Shortfall
            icon: mdi:battery-minus-outline
            vertical: false

          - type: tile
            entity: sensor.energy_planner_rolling_risk_day_capacity_export
            name: Capacity-Limited Export Risk
            icon: mdi:transmission-tower-export
            vertical: false

          - type: button
            name: Energy History Export
            icon: mdi:history
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: >-
                /history?entity_id=sensor.envoy_482538078562_current_net_power_consumption%2Csensor.envoy_482538078562_current_power_production%2Csensor.ecoflow_smart_home_panel_2_grid_power%2Csensor.ecoflow_smart_home_panel_2_home_power%2Csensor.ecoflow_delta_pro_ultra_battery%2Csensor.ecoflow_delta_pro_ultra_battery_2%2Csensor.ecoflow_delta_pro_ultra_battery_3%2Cnumber.ecoflow_smart_home_panel_2_charging_power%2Cnumber.ecoflow_smart_home_panel_2_backup_reserve_level%2Csensor.solar_actual_power%2Csensor.solar_forecast_power_now%2Csensor.energy_production_today%2Csensor.energy_production_today_remaining%2Csensor.energy_production_tomorrow%2Csensor.house_end_use_power%2Csensor.forecast_base_load_3h_average%2Csensor.forecast_base_load_24h_average%2Csensor.energy_planner_whole_bank_soc%2Csensor.energy_planner_battery_headroom%2Csensor.energy_planner_rolling_headroom_shortfall%2Csensor.energy_planner_rolling_risk_day_capacity_export%2Csensor.energy_planner_rolling_headroom_risk_date%2Cbinary_sensor.energy_planner_headroom_risk_today%2Csensor.car_charger_power%2Csensor.hot_tub_power%2Csensor.hvac_power%2Csensor.networking_servers_power%2Csensor.rear_patio_power

      - type: grid
        cards:
          - type: heading
            heading: What To Do
            icon: mdi:lightbulb-on-outline

          - type: markdown
            content: >-
              {% set ev = 'binary_sensor.energy_planner_ev_auto_charge_eligible' %}
              {% set status = states('sensor.energy_planner_rolling_ev_advisory_status') %}
              {% set reason = state_attr(ev,'reason') %}
              {% set useful = states('sensor.energy_planner_recommended_ev_charge_energy') | float(0) %}
              {% if status == 'green' %}
              ## 🟢 EV / FLEXIBLE LOAD USEFUL
              {% elif status == 'yellow' %}
              ## 🟡 FLEXIBLE LOAD OPTIONAL
              {% elif status == 'red' %}
              ## 🔴 FLEXIBLE LOAD NOT NEEDED
              {% else %}
              ## ⚪ FLEXIBLE-LOAD OUTLOOK UNAVAILABLE
              {% endif %}
              **{{ reason or 'Planner is evaluating the best use of flexible load.' }}**  
              {% if useful > 0 %}Recommended EV energy: **{{ useful | round(1) }} kWh**{% endif %}

          - type: tile
            entity: binary_sensor.energy_planner_ev_auto_charge_eligible
            name: Auto-Charge Eligible
            icon: mdi:ev-station
            vertical: false

          - type: tile
            entity: sensor.energy_planner_ev_available_energy_to_target
            name: EV Energy Available
            icon: mdi:car-battery
            vertical: false

          - type: tile
            entity: sensor.energy_planner_recommended_ev_charge_energy
            name: Recommended EV Energy
            icon: mdi:battery-charging-medium
            vertical: false

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_ev_auto_charge_eligible' %}
              {% set start = state_attr(e,'preferred_window_start') %}
              {% set end = state_attr(e,'preferred_window_end') %}
              {% set solar = state_attr(e,'preferred_window_solar_fraction_pct') %}
              ### Preferred EV charging window
              {% if start and end %}
              **{{ as_local(as_datetime(start)).strftime('%-I:%M %p') }} – {{ as_local(as_datetime(end)).strftime('%-I:%M %p') }}**  
              Solar supplied: **{{ solar | round(0) if solar is number else '—' }}%**
              {% else %}
              No EV charging window is currently required.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Solar & Battery Outlook
            icon: mdi:weather-sunny

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_next_sunset_forecast_available' %}
              {% set d = state_attr(e,'date') %}
              {% set soc = state_attr(e,'soc_pct') %}
              {% set charge = state_attr(e,'expected_charge_kwh') %}
              {% set export = state_attr(e,'expected_export_kwh') %}
              ### Next sunset{% if d %} — {{ d }}{% endif %}
              **Projected SOC:** {{ soc | round(1) if soc is number else '—' }}%  
              **Expected battery gain:** {{ charge | round(1) if charge is number else '—' }} kWh  
              **Expected export:** {{ export | round(1) if export is number else '—' }} kWh

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_ev_auto_charge_eligible' %}
              {% set s3 = state_attr(e,'surplus_next_3d_kwh') %}
              {% set sh = state_attr(e,'surplus_horizon_kwh') %}
              {% set risk = states('sensor.energy_planner_rolling_headroom_risk_date') %}
              ### Rolling energy outlook
              **Solar after house load — next 3 days:** {{ s3 | round(1) if s3 is number else '—' }} kWh  
              **Solar after house load — full forecast horizon:** {{ sh | round(1) if sh is number else '—' }} kWh  
              **First modeled headroom-risk day:** {{ risk }}

          - type: tile
            entity: sensor.energy_planner_rolling_risk_day_projected_sunset_soc
            name: Risk-Day Sunset SOC
            icon: mdi:battery-high
            vertical: false

          - type: tile
            entity: sensor.energy_planner_residual_headroom_shortfall_after_ev_charge
            name: Residual Headroom Risk After EV
            icon: mdi:battery-alert
            vertical: false

          - type: tile
            entity: sensor.energy_planner_residual_capacity_export_after_ev_charge
            name: Residual Export After EV
            icon: mdi:transmission-tower-export
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: Forecast Quality
            icon: mdi:chart-bell-curve-cumulative

          - type: tile
            entity: sensor.energy_planner_forecast_solar_enhancement_status
            name: Forecast.Solar
            icon: mdi:weather-sunny-alert
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_solar_paid_raw_remaining_today
            name: Forecast.Solar Raw Remaining
            icon: mdi:solar-power-variant
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_solar_shadow_energy_scale_factor
            name: Local / Forecast.Solar Scale
            icon: mdi:scale-balance
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_solar_interval_resolution
            name: Forecast Resolution
            icon: mdi:timeline-clock-outline
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_calibration_status
            name: Calibration Status
            icon: mdi:chart-timeline-variant-shimmer
            vertical: false

          - type: tile
            entity: sensor.energy_planner_daylight_stored_energy_forecast_mae
            name: Daylight Forecast MAE
            icon: mdi:chart-line-variant
            vertical: false
