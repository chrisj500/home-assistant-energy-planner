# Energy Planning dashboard v17
#
# Action-first Lovelace dashboard for Energy Planner v0.1.35.
# Requires custom:button-card for the Headroom Decision, Battery Bank,
# and four-day Battery Outlook cards.
#
# Design priorities:
# 1. Show whether any action is needed at a glance.
# 2. Show current EcoFlow battery-bank state and charge flow.
# 3. Show four-day battery trajectory using NOW/SUNRISE and SUNSET SOC.
# 4. Surface EV/flexible-load actions only when useful.
# 5. Keep forecast-quality diagnostics available without cluttering decisions.

views:
  - title: Energy Planning
    path: energy-planning
    icon: mdi:solar-power
    type: sections
    max_columns: 4

    sections:

      - type: grid
        cards:
          - type: heading
            heading: HVAC Overview
            icon: mdi:thermostat
          - type: custom:button-card
            entity: climate.thermostat
            triggers_update: all
            show_name: false
            show_icon: false
            tap_action:
              action: more-info
            styles:
              card:
                - padding: 22px
                - border-radius: 28px
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              custom_fields:
                content:
                  - white-space: normal
                  - text-align: center
                  - min-width: 0
            custom_fields:
              content: |
                [[[
                  const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                  const num = x => x !== null && x !== undefined && x !== '' && Number.isFinite(Number(x)) ? Number(x) : null;
                  const avg = values => {
                    const valid = values.filter(v => v !== null);
                    return valid.length ? valid.reduce((a,b) => a + b, 0) / valid.length : null;
                  };
                  const t = states['climate.thermostat'];
                  const a = t?.attributes || {};
                  const valid = t && !['unknown','unavailable'].includes(t.state);
                  const action = valid ? (a.hvac_action || '') : '';
                  const actionModes = {
                    cooling: ['Cooling','mdi:snowflake','#64c7ff'],
                    heating: ['Heating','mdi:fire','#ffac66'],
                    fan: ['Fan only','mdi:fan','#7bddbf'],
                    idle: ['Idle','mdi:pause-circle-outline','#c5cbd5'],
                    off: ['Off','mdi:power','#c5cbd5'],
                    drying: ['Drying','mdi:water-percent','#aab2ff'],
                    defrosting: ['Defrosting','mdi:snowflake-melt','#aab2ff']
                  };
                  const thermostatModes = {
                    cool: ['Cool mode','mdi:snowflake','#64c7ff'],
                    heat: ['Heat mode','mdi:fire','#ffac66'],
                    fan_only: ['Fan only','mdi:fan','#7bddbf'],
                    dry: ['Dry mode','mdi:water-percent','#aab2ff'],
                    heat_cool: ['Auto mode','mdi:autorenew','#c5cbd5'],
                    off: ['Off','mdi:power','#c5cbd5']
                  };
                  const [label, icon, color] = !valid
                    ? ['State unavailable','mdi:help-circle-outline','#c5cbd5']
                    : (actionModes[action] || thermostatModes[t.state] || [`${String(t.state || 'Mode').replaceAll('_',' ')} mode`,'mdi:thermostat','#c5cbd5']);
                  const unit = a.temperature_unit || hass.config.unit_system.temperature;
                  const current = valid ? num(a.current_temperature) : null;
                  const target = num(a.temperature);
                  const fmt = x => x === null ? '—' : x.toFixed(1);
                  const setpoint = target !== null ? `${fmt(target)}${esc(unit)}` :
                    (num(a.target_temp_low) !== null && num(a.target_temp_high) !== null ? `${fmt(num(a.target_temp_low))}–${fmt(num(a.target_temp_high))}${esc(unit)}` : '—');

                  const roomState = (room, metric) => {
                    const suffix = `${room}_${metric}`;
                    const candidates = [
                      `sensor.homepod_indoor_climate_${suffix}`,
                      `sensor.home_homepod_indoor_climate_${suffix}`
                    ];
                    for (const id of candidates) {
                      if (states[id]) return [id, states[id]];
                    }
                    const id = Object.keys(states).find(
                      key => key.startsWith('sensor.') &&
                        key.includes('homepod_indoor_climate') &&
                        key.endsWith(`_${suffix}`)
                    );
                    return id ? [id, states[id]] : [null, null];
                  };
                  const reading = (room, metric) => {
                    const [id, s] = roomState(room, metric);
                    if (!s || ['unknown','unavailable'].includes(s.state)) {
                      return {id, value:null, unit:'', fresh:false};
                    }
                    const last = s.attributes?.last_received;
                    const age = last ? (Date.now() - Date.parse(last)) / 60000 : null;
                    const freshFlag = s.attributes?.fresh;
                    const fresh = freshFlag !== false && (age === null || (Number.isFinite(age) && age >= 0 && age <= 15));
                    return {
                      id,
                      value: fresh ? num(s.state) : null,
                      unit: s.attributes?.unit_of_measurement || (metric === 'humidity' ? '%' : unit),
                      fresh
                    };
                  };
                  const room = key => ({
                    temperature: reading(key, 'temperature'),
                    humidity: reading(key, 'humidity')
                  });
                  const living = room('living_room');
                  const guest = room('guest_bedroom');
                  const mainLeft = room('main_bedroom_left');
                  const mainRight = room('main_bedroom_right');
                  const mainTemp = avg([mainLeft.temperature.value, mainRight.temperature.value]);
                  const mainHumidity = avg([mainLeft.humidity.value, mainRight.humidity.value]);
                  const mainCount = [mainLeft.temperature.value, mainRight.temperature.value].filter(v => v !== null).length;
                  const houseTemp = avg([living.temperature.value, guest.temperature.value, mainTemp]);
                  const houseHumidity = avg([living.humidity.value, guest.humidity.value, mainHumidity]);
                  const houseCount = [living.temperature.value, guest.temperature.value, mainTemp].filter(v => v !== null).length;
                  const roomCard = (name, temperature, humidity, note='') => {
                    const hasValue = temperature !== null || humidity !== null;
                    return `<div style="padding:12px 8px;background:var(--secondary-background-color);border-radius:14px;min-height:92px"><div style="font-size:12px;line-height:1.35">${esc(name)}</div><div style="font-size:23px;font-weight:600;margin-top:5px">${fmt(temperature)}${temperature === null ? '' : esc(unit)}</div><div style="font-size:12px;margin-top:3px;color:var(--secondary-text-color)">${humidity === null ? '—' : `${fmt(humidity)}% RH`}</div>${!hasValue ? '<div style="font-size:12px;margin-top:4px">Missing or stale</div>' : note ? `<div style="font-size:10px;margin-top:4px;color:var(--secondary-text-color)">${esc(note)}</div>` : ''}</div>`;
                  };
                  const rooms = [
                    roomCard('Main bedroom', mainTemp, mainHumidity, mainCount === 2 ? 'Left + right average' : `${mainCount}/2 HomePods available`),
                    roomCard('Guest bedroom', guest.temperature.value, guest.humidity.value),
                    roomCard('Living room', living.temperature.value, living.humidity.value),
                    roomCard('House average', houseTemp, houseHumidity, `${houseCount}/3 physical rooms`)
                  ].join('');

                  const p = num(states['sensor.energy_planner_hvac_electrical_power']?.state);
                  const e = states['sensor.energy_planner_hvac_daily_electricity'];
                  const kwh = num(e?.state);
                  const coverage = num(e?.attributes.coverage_percent);
                  const energyLabel = kwh === null ? 'Unavailable' : `${kwh.toFixed(2)} kWh`;
                  const powerLabel = p === null ? 'Unavailable' : p >= 1000 ? `${(p/1000).toFixed(2)} kW` : `${Math.round(p)} W`;
                  const BASE_IMPORT_RATE_USD_PER_KWH = 0.25;
                  const costToday = kwh === null ? null : kwh * BASE_IMPORT_RATE_USD_PER_KWH;
                  const costTodayLabel = costToday === null
                    ? 'Cost unavailable'
                    : `Estimated cost today ${costToday.toFixed(2)} @ ${BASE_IMPORT_RATE_USD_PER_KWH.toFixed(2)}/kWh`;
                  const model = states['sensor.energy_planner_hvac_model_status'];
                  const m = model?.attributes || {};
                  const configuredOutdoorId = m?.entities?.hvac_outdoor_temperature || 'sensor.ecowitt_outdoor_temperature';
                  const configuredWeatherId = m?.entities?.hvac_weather || 'weather.forecast_home';
                  const outdoorState = states[configuredOutdoorId];
                  const weatherState = states[configuredWeatherId];
                  const convertTemp = (value, fromUnit, toUnit) => {
                    if (value === null) return null;
                    if (!fromUnit || fromUnit === toUnit) return value;
                    if (fromUnit === '°C' && toUnit === '°F') return value * 1.8 + 32;
                    if (fromUnit === '°F' && toUnit === '°C') return (value - 32) / 1.8;
                    return null;
                  };
                  const outdoorRaw = outdoorState && !['unknown','unavailable'].includes(outdoorState.state) ? num(outdoorState.state) : null;
                  const outdoor = convertTemp(outdoorRaw, outdoorState?.attributes?.unit_of_measurement, unit);
                  const outdoorDelta = outdoor !== null && target !== null ? outdoor - target : null;
                  const insideHumidity = num(a.current_humidity);
                  const outsideHumidity = weatherState && !['unknown','unavailable'].includes(weatherState.state)
                    ? num(weatherState.attributes?.humidity)
                    : null;
                  const humidityDelta = outsideHumidity !== null && insideHumidity !== null
                    ? outsideHumidity - insideHumidity
                    : null;
                  const signed = value => value === null ? '—' : `${value > 0 ? '+' : ''}${value.toFixed(1)}`;
                  const outdoorLine = outdoor === null
                    ? 'Outside temperature unavailable'
                    : `Outside ${fmt(outdoor)}${esc(unit)} · Target ${target === null ? '—' : `${fmt(target)}${esc(unit)}`} · Δ ${signed(outdoorDelta)}${esc(unit)}`;
                  const humidityLine = outsideHumidity === null || insideHumidity === null
                    ? 'Outside / inside humidity unavailable'
                    : `Outside RH ${outsideHumidity.toFixed(1)}% · Inside RH ${insideHumidity.toFixed(1)}% · Δ ${signed(humidityDelta)} pts`;
                  const recovery = m?.recovery || {};
                  const thermal = m?.thermal || {};
                  const rateFactor = unit === '°F' ? 1.8 : 1;
                  const recoveryEta = num(recovery.eta_minutes);
                  const recoveryRate = num(recovery.rate_c_per_hour);
                  const recoveryCycles = num(recovery.completed_cycles) ?? 0;
                  const recoveryLine = recovery.active
                    ? recoveryEta !== null
                      ? `Recovery ETA ${Math.round(recoveryEta)} min · ${(recoveryRate * rateFactor).toFixed(1)}${esc(unit)}/h · ${esc(recovery.status || recovery.source || 'estimate')}`
                      : `Recovery ${esc(recovery.status || 'learning')} · ${recoveryCycles} completed calls`
                    : `Recovery model · ${recoveryCycles} completed calls`;
                  const thermalDrift = num(thermal.predicted_drift_c_per_hour);
                  const thermalTau = num(thermal.time_constant_hours);
                  const thermalSamples = num(thermal.samples) ?? 0;
                  const thermalRequired = num(thermal.samples_required) ?? 3;
                  const thermalLine = thermalDrift !== null
                    ? `Passive thermal drift ${signed(thermalDrift * rateFactor)}${esc(unit)}/h at current ΔT · τ ${thermalTau?.toFixed(1) ?? '—'} h · ${esc(thermal.status || thermal.source || 'estimate')}`
                    : `Passive thermal model ${esc(thermal.status || 'learning')} · ${thermalSamples}/${thermalRequired} completed idle windows`;
                  const learningState = model?.state || 'unavailable';
                  const learningSamples = num(m.learning_samples) ?? 0;
                  const learningSamplesRequired = num(m.learning_samples_required) ?? 36;
                  const learningDays = num(m.learning_days) ?? 0;
                  const learningDaysRequired = num(m.learning_days_required) ?? 3;
                  const learningPct = num(m.learning_progress_pct) ?? 0;
                  const learningColor = learningState === 'ready' ? '#30d158' : learningState === 'suspected_fault' || learningState === 'unavailable' ? '#ff453a' : '#ffd60a';
                  const hourlySupported = num(m.hourly_supported_hours) ?? 0;
                  const hourlyTotal = num(m.hourly_forecast_hours) ?? 0;
                  const sourceData = states['sensor.energy_planner_hvac_electrical_power']?.attributes?.power_sources || {};
                  const sourceItems = Object.values(sourceData);
                  const sourceIssues = sourceItems.filter(x => x && x.available === false).map(x => `${esc(x.entity_id)}: ${esc(x.raw_state)} (${esc(x.reason)})`);
                  const sourceLabel = !sourceItems.length ? 'Power source diagnostics unavailable' : sourceIssues.length ? sourceIssues.join(' · ') : 'Condenser and blower/control sources available';

                  return `<div style="color:var(--primary-text-color);font-family:inherit">
                    <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:${color};font-size:20px;font-weight:600"><ha-icon icon="${icon}" style="width:26px"></ha-icon>${label}</div>
                    <div style="font-size:12px;margin-top:6px">Thermostat-reported state · Mode: ${esc(valid ? t.state : 'unknown')}</div>
                    <div style="position:relative;width:min(100%,250px);aspect-ratio:1;margin:18px auto">
                      <svg viewBox="0 0 240 240" style="width:100%;height:100%" aria-hidden="true"><circle cx="120" cy="120" r="105" fill="none" stroke="var(--divider-color)" stroke-width="12"/><circle cx="120" cy="120" r="105" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="495 660" transform="rotate(135 120 120)"/><circle cx="120" cy="120" r="89" fill="none" stroke="var(--divider-color)" stroke-width="1"/></svg>
                      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center"><div style="font-size:12px;letter-spacing:1px">THERMOSTAT</div><div style="font-size:46px;font-weight:650;margin:6px 0">${fmt(current)}<span style="font-size:19px">${esc(unit)}</span></div><div style="font-size:15px">Target ${setpoint}</div><div style="font-size:13px;margin-top:8px">Humidity ${fmt(num(a.current_humidity))}%</div></div>
                    </div>
                    <div style="margin:-2px 0 16px;padding:10px 12px;border-radius:14px;background:var(--secondary-background-color);font-size:12px;line-height:1.6;color:var(--secondary-text-color)">
                      <div><ha-icon icon="mdi:thermometer" style="width:16px;margin-right:4px"></ha-icon>${outdoorLine}</div>
                      <div><ha-icon icon="mdi:water-percent" style="width:16px;margin-right:4px"></ha-icon>${humidityLine}</div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${rooms}</div>
                    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;border-top:1px solid var(--divider-color);padding-top:18px"><div><div style="font-size:13px">Electricity now</div><div style="font-size:24px;font-weight:600;margin-top:6px">${powerLabel}</div></div><div><div style="font-size:13px">Electricity today</div><div style="font-size:24px;font-weight:600;margin-top:6px">${energyLabel}</div></div><div style="grid-column:1 / -1;font-size:11px;color:var(--secondary-text-color);margin-top:2px">${costTodayLabel}</div></div>
                    <div style="margin-top:16px;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.045);text-align:left">
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-size:12px;font-weight:700">HVAC learner</span><span style="font-size:12px;font-weight:750;color:${learningColor}">${esc(learningState)}</span></div>
                      <div style="margin-top:7px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.62)">${learningSamples}/${learningSamplesRequired} clean five-minute samples · ${learningDays}/${learningDaysRequired} days · ${learningPct.toFixed(0)}% ready<br>Hourly weather-matched support: ${hourlySupported}/${hourlyTotal} forecast hours<br>${recoveryLine}<br>${thermalLine}</div>
                    </div>
                    <div style="font-size:11px;line-height:1.5;margin-top:11px;color:rgba(255,255,255,.50)">${sourceLabel}<br>Condenser + blower/controls · Gas excluded · ${kwh === null ? "Daily tracking unavailable" : `${e.attributes.partial ? "Partial day" : "Day coverage"} · ${coverage ?? 0}% measured coverage`}</div>
                  </div>`;
                ]]]

      ##########################################################################
      # HEADROOM DECISION
      ##########################################################################

      - type: grid
        cards:

          - type: heading
            heading: Headroom Decision
            icon: mdi:battery-alert-variant-outline

          ######################################################################
          # BATTERY BANK
          ######################################################################

          - type: custom:button-card
            entity: sensor.ecoflow_smart_home_panel_2_backup_battery
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: more-info

            triggers_update:
              - sensor.ecoflow_smart_home_panel_2_backup_battery
              - sensor.ecoflow_smart_home_panel_2_ac1_battery
              - sensor.ecoflow_smart_home_panel_2_ac1_power
              - sensor.ecoflow_smart_home_panel_2_ac2_battery
              - sensor.ecoflow_smart_home_panel_2_ac2_power
              - sensor.ecoflow_smart_home_panel_2_ac3_battery
              - sensor.ecoflow_smart_home_panel_2_ac3_power
              - sensor.patio_ecoflow_smart_home_panel_2_backup_charge_time_remaining

            custom_fields:
              content: |
                [[[
                  const num = (id) => {
                    const s = states[id];

                    if (
                      !s ||
                      ['unknown','unavailable'].includes(s.state)
                    ) {
                      return null;
                    }

                    const n = Number(s.state);
                    return Number.isFinite(n) ? n : null;
                  };

                  const soc =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_backup_battery'
                    );

                  const soc1 =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_ac1_battery'
                    );

                  const soc2 =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_ac2_battery'
                    );

                  const soc3 =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_ac3_battery'
                    );

                  const p1 =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_ac1_power'
                    ) ?? 0;

                  const p2 =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_ac2_power'
                    ) ?? 0;

                  const p3 =
                    num(
                      'sensor.ecoflow_smart_home_panel_2_ac3_power'
                    ) ?? 0;

                  const eta =
                    num(
                      'sensor.patio_ecoflow_smart_home_panel_2_backup_charge_time_remaining'
                    );

                  const totalPower = p1 + p2 + p3;

                  const charging = totalPower > 50;
                  const discharging = totalPower < -50;

                  const flowAccent =
                    charging
                      ? '#41e66f'
                      : discharging
                        ? '#68a8ff'
                        : '#a8adb5';

                  const status =
                    charging
                      ? 'CHARGING'
                      : discharging
                        ? 'DISCHARGING'
                        : 'IDLE';

                  const statusIcon =
                    charging
                      ? 'mdi:lightning-bolt'
                      : discharging
                        ? 'mdi:home-lightning-bolt-outline'
                        : 'mdi:power-sleep';

                  const clamp = (v) =>
                    v === null
                      ? 0
                      : Math.max(0,Math.min(100,v));

                  const socText = (v) =>
                    v === null
                      ? '—'
                      : `${Math.round(v)}%`;

                  const powerText = (p) => {
                    const a = Math.abs(p);

                    return a >= 1000
                      ? `${(a / 1000).toFixed(2)} kW`
                      : `${Math.round(a)} W`;
                  };

                  const formatEta = (minutes) => {

                    if (
                      minutes === null ||
                      minutes <= 0
                    ) {
                      return 'Calculating remaining time';
                    }

                    const h =
                      Math.floor(minutes / 60);

                    const m =
                      Math.round(minutes % 60);

                    if (h === 0)
                      return `Full in ${m}m`;

                    if (m === 0)
                      return `Full in ${h}h`;

                    return `Full in ${h}h ${m}m`;
                  };

                  const etaText =
                    charging
                      ? formatEta(eta)
                      : discharging
                        ? 'Supplying the home'
                        : 'Not currently charging';

                  const stackPower = (p) => {

                    if (Math.abs(p) < 50)
                      return 'Idle';

                    return p > 0
                      ? `${powerText(p)} in`
                      : `${powerText(p)} out`;
                  };

                  const batteryBar = (
                    level,
                    height = 8
                  ) => `
                    <div style="
                      position:relative;
                      height:${height}px;
                      border-radius:999px;
                      overflow:hidden;
                      background:rgba(255,255,255,.09);
                    ">

                      <div style="
                        position:absolute;
                        inset:0 auto 0 0;
                        width:${clamp(level)}%;
                        border-radius:999px;
                        background:
                          linear-gradient(
                            90deg,
                            #29c95a,
                            #41e66f
                          );
                        transition:width .5s ease;
                      ">
                      </div>

                      <div style="
                        position:absolute;
                        inset:0;
                        background-image:
                          linear-gradient(
                            to right,
                            transparent calc(100% - 2px),
                            rgba(17,18,20,.72) 0
                          );
                        background-size:10% 100%;
                      ">
                      </div>

                    </div>
                  `;

                  const stack = (
                    name,
                    battery,
                    power
                  ) => `
                    <div style="
                      background:
                        rgba(255,255,255,.04);
                      border:
                        1px solid
                        rgba(255,255,255,.07);
                      border-radius:16px;
                      padding:12px;
                      min-width:0;
                    ">

                      <div style="
                        display:flex;
                        justify-content:
                          space-between;
                        align-items:center;
                        margin-bottom:9px;
                      ">

                        <span style="
                          font-size:11px;
                          letter-spacing:.10em;
                          font-weight:750;
                          color:
                            rgba(255,255,255,.58);
                        ">
                          ${name}
                        </span>

                        <ha-icon
                          icon="${
                            power > 50
                              ? 'mdi:lightning-bolt'
                              : power < -50
                                ? 'mdi:home-lightning-bolt-outline'
                                : 'mdi:battery'
                          }"
                          style="
                            width:15px;
                            color:${
                              Math.abs(power) > 50
                                ? flowAccent
                                : 'rgba(255,255,255,.4)'
                            };
                          ">
                        </ha-icon>

                      </div>

                      <div style="
                        font-size:24px;
                        font-weight:650;
                        color:#fff;
                        margin-bottom:9px;
                      ">
                        ${socText(battery)}
                      </div>

                      ${batteryBar(battery,6)}

                      <div style="
                        margin-top:8px;
                        font-size:10px;
                        color:
                          rgba(255,255,255,.55);
                      ">
                        ${stackPower(power)}
                      </div>

                    </div>
                  `;

                  return `
                    <div>

                      <div style="
                        display:flex;
                        justify-content:
                          space-between;
                        align-items:flex-start;
                        gap:10px;
                        margin-bottom:17px;
                      ">

                        <div>

                          <div style="
                            font-size:20px;
                            font-weight:650;
                            color:#fff;
                          ">
                            Battery Bank
                          </div>

                          <div style="
                            margin-top:4px;
                            font-size:11px;
                            color:
                              rgba(255,255,255,.55);
                          ">
                            EcoFlow Smart Home Panel 2
                          </div>

                        </div>

                        <div style="
                          display:flex;
                          align-items:center;
                          gap:5px;
                          padding:6px 9px;
                          border-radius:999px;
                          background:${flowAccent}18;
                          color:${flowAccent};
                          font-size:10px;
                          font-weight:800;
                          letter-spacing:.10em;
                        ">

                          <ha-icon
                            icon="${statusIcon}"
                            style="width:14px;">
                          </ha-icon>

                          ${status}

                        </div>

                      </div>

                      <div style="
                        display:grid;
                        grid-template-columns:
                          1.2fr .8fr;
                        gap:16px;
                        align-items:end;
                        margin-bottom:19px;
                      ">

                        <div>

                          <div style="
                            font-size:10px;
                            font-weight:750;
                            letter-spacing:.12em;
                            color:
                              rgba(255,255,255,.45);
                          ">
                            BANK SOC
                          </div>

                          <div style="
                            margin:4px 0 12px;
                            font-size:53px;
                            line-height:1;
                            font-weight:560;
                            letter-spacing:-.06em;
                            color:#fff;
                          ">
                            ${socText(soc)}
                          </div>

                          ${batteryBar(soc,10)}

                        </div>

                        <div>

                          <div style="
                            font-size:10px;
                            font-weight:750;
                            letter-spacing:.11em;
                            color:
                              rgba(255,255,255,.45);
