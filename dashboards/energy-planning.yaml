# Energy Planning dashboard v7
#
# Decision-first Lovelace dashboard for Energy Planner v0.1.20
# with EcoFlow Solar Surplus Controller v0.1.11 realtime Envoy diagnostics.
# Requires custom:button-card for the Battery Bank operational card.
# Primary questions:
# 1. Is battery headroom at risk today?
# 2. Which forecast days need useful dynamic load, and how much?
# 3. Can the EV absorb that energy without unnecessary grid charging?
# 4. Is the realtime solar-surplus controller using native Envoy MQTT telemetry?

views:
  - title: Energy Planning
    path: energy-planning
    icon: mdi:solar-power
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Headroom Decision
            icon: mdi:battery-alert-variant-outline

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_headroom_risk_today' %}
              {% set status = state_attr(e,'status') %}
              {% set shortfall = state_attr(e,'shortfall_kwh') %}
              {% set export = state_attr(e,'capacity_export_kwh') %}
              {% set action = state_attr(e,'action') %}
              {% set scale = state_attr(e,'current_day_scale_factor') %}
              {% set source = state_attr(e,'forecast_source') %}
              {% if is_state(e,'on') %}
              ## ⚠️ HEADROOM RISK — TODAY
              **Projected storage shortfall:** {{ shortfall | round(1) if shortfall is number else '—' }} kWh  
              **Capacity-limited export if no useful load is added:** {{ export | round(1) if export is number else '—' }} kWh  
              **Action:** {{ action or 'Use useful flexible load before the battery fills.' }}
              {% elif status == 'risk_future' %}
              ## 🟡 HEADROOM RISK — FUTURE
              **First risk day:** {{ state_attr(e,'risk_date') or '—' }}  
              {{ action or 'Preserve flexible-load capacity for the risk day.' }}
              {% else %}
              ## 🟢 NO MATERIAL HEADROOM RISK TODAY
              {{ action or 'No headroom action is currently required.' }}
              {% endif %}

              Forecast basis: **{{ source or 'unavailable' }}**{% if scale is number %} · current-day scale **{{ scale | round(2) }}×**{% endif %}

          - type: custom:button-card
            entity: sensor.ecoflow_smart_home_panel_2_backup_battery
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: more-info
            triggers_update:
              - sensor.ecoflow_smart_home_panel_2_backup_battery
              - sensor.ecoflow_smart_home_panel_2_ac1_battery
              - sensor.ecoflow_smart_home_panel_2_ac1_power
              - sensor.ecoflow_smart_home_panel_2_ac2_battery
              - sensor.ecoflow_smart_home_panel_2_ac2_power
              - sensor.ecoflow_smart_home_panel_2_ac3_battery
              - sensor.ecoflow_smart_home_panel_2_ac3_power
              - sensor.patio_ecoflow_smart_home_panel_2_backup_charge_time_remaining
            custom_fields:
              content: |
                [[[
                  const num = (id) => {
                    const s = states[id];
                    if (!s || ['unknown', 'unavailable'].includes(s.state)) return null;
                    const n = Number(s.state);
                    return Number.isFinite(n) ? n : null;
                  };

                  const soc = num('sensor.ecoflow_smart_home_panel_2_backup_battery');
                  const soc1 = num('sensor.ecoflow_smart_home_panel_2_ac1_battery');
                  const soc2 = num('sensor.ecoflow_smart_home_panel_2_ac2_battery');
                  const soc3 = num('sensor.ecoflow_smart_home_panel_2_ac3_battery');
                  const p1 = num('sensor.ecoflow_smart_home_panel_2_ac1_power') ?? 0;
                  const p2 = num('sensor.ecoflow_smart_home_panel_2_ac2_power') ?? 0;
                  const p3 = num('sensor.ecoflow_smart_home_panel_2_ac3_power') ?? 0;
                  const eta = num('sensor.patio_ecoflow_smart_home_panel_2_backup_charge_time_remaining');
                  const totalPower = p1 + p2 + p3;

                  const charging = totalPower > 50;
                  const discharging = totalPower < -50;
                  const socAccent = '#41e66f';
                  const flowAccent = charging ? '#41e66f' : discharging ? '#68a8ff' : '#a8adb5';
                  const status = charging ? 'CHARGING' : discharging ? 'DISCHARGING' : 'IDLE';
                  const statusIcon = charging
                    ? 'mdi:lightning-bolt'
                    : discharging
                      ? 'mdi:home-lightning-bolt-outline'
                      : 'mdi:power-sleep';

                  const clamp = (v) => v === null ? 0 : Math.max(0, Math.min(100, v));
                  const socText = (v) => v === null ? '—' : `${Math.round(v)}%`;
                  const powerText = (p) => {
                    const a = Math.abs(p);
                    return a >= 1000 ? `${(a / 1000).toFixed(2)} kW` : `${Math.round(a)} W`;
                  };
                  const formatEta = (minutes) => {
                    if (minutes === null || minutes <= 0) return 'Calculating remaining time';
                    const h = Math.floor(minutes / 60);
                    const m = Math.round(minutes % 60);
                    if (h === 0) return `Full in ${m}m`;
                    if (m === 0) return `Full in ${h}h`;
                    return `Full in ${h}h ${m}m`;
                  };
                  const etaText = charging
                    ? formatEta(eta)
                    : discharging
                      ? 'Supplying the home'
                      : 'Not currently charging';
                  const stackPower = (p) => {
                    if (Math.abs(p) < 50) return 'Idle';
                    return p > 0 ? `${powerText(p)} in` : `${powerText(p)} out`;
                  };

                  const batteryBar = (level, height = 8) => `
                    <div style="
                      position:relative;
                      height:${height}px;
                      border-radius:999px;
                      overflow:hidden;
                      background:rgba(255,255,255,.09);
                      box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
                    ">
                      <div style="
                        position:absolute;
                        inset:0 auto 0 0;
                        width:${clamp(level)}%;
                        border-radius:999px;
                        background:linear-gradient(90deg,#29c95a 0%,${socAccent} 100%);
                        box-shadow:0 0 14px rgba(65,230,111,.28);
                        transition:width .5s ease;
                      "></div>
                      <div style="
                        position:absolute;
                        inset:0;
                        background-image:linear-gradient(to right,transparent calc(100% - 2px),rgba(17,18,20,.72) 0);
                        background-size:10% 100%;
                        pointer-events:none;
                      "></div>
                    </div>`;

                  const stack = (name, battery, power) => `
                    <div style="
                      background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.028));
                      border:1px solid rgba(255,255,255,.075);
                      border-radius:17px;
                      padding:13px 12px 12px;
                      min-width:0;
                    ">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <span style="font-size:12px;letter-spacing:.1em;font-weight:750;color:rgba(255,255,255,.62);">${name}</span>
                        <ha-icon
                          icon="${power > 50 ? 'mdi:lightning-bolt' : power < -50 ? 'mdi:home-lightning-bolt-outline' : 'mdi:battery'}"
                          style="width:16px;color:${Math.abs(power) > 50 ? flowAccent : 'rgba(255,255,255,.48)'};">
                        </ha-icon>
                      </div>
                      <div style="font-size:25px;line-height:1;font-weight:650;color:#fff;margin-bottom:10px;letter-spacing:-.03em;">
                        ${socText(battery)}
                      </div>
                      ${batteryBar(battery, 6)}
                      <div style="margin-top:9px;color:rgba(255,255,255,.62);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                        ${stackPower(power)}
                      </div>
                    </div>`;

                  return `
                    <div style="padding:1px 0 0;font-family:var(--primary-font-family,sans-serif);">
                      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;">
                        <div>
                          <div style="font-size:21px;font-weight:650;color:#fff;letter-spacing:-.025em;">Battery Bank</div>
                          <div style="margin-top:4px;font-size:12px;color:rgba(255,255,255,.58);">EcoFlow Smart Home Panel 2</div>
                        </div>
                        <div style="
                          display:flex;
                          align-items:center;
                          gap:6px;
                          padding:6px 9px;
                          border-radius:999px;
                          background:${flowAccent}18;
                          color:${flowAccent};
                          font-size:10px;
                          font-weight:800;
                          letter-spacing:.11em;
                          white-space:nowrap;
                        ">
                          <ha-icon icon="${statusIcon}" style="width:15px;"></ha-icon>
                          ${status}
                        </div>
                      </div>

                      <div style="
                        display:grid;
                        grid-template-columns:minmax(0,1.2fr) minmax(118px,.8fr);
                        gap:18px;
                        align-items:end;
                        margin-bottom:20px;
                      ">
                        <div>
                          <div style="font-size:11px;font-weight:750;letter-spacing:.12em;color:rgba(255,255,255,.48);margin-bottom:5px;">BANK SOC</div>
                          <div style="font-size:55px;line-height:.98;font-weight:560;letter-spacing:-.065em;color:#fff;margin-bottom:14px;">${socText(soc)}</div>
                          ${batteryBar(soc, 11)}
                        </div>

                        <div style="padding-bottom:1px;">
                          <div style="font-size:11px;font-weight:750;letter-spacing:.12em;color:rgba(255,255,255,.48);margin-bottom:6px;">${charging ? 'CHARGE RATE' : discharging ? 'OUTPUT' : 'POWER FLOW'}</div>
                          <div style="display:flex;align-items:center;gap:7px;">
                            <ha-icon icon="${statusIcon}" style="width:22px;color:${flowAccent};"></ha-icon>
                            <span style="font-size:25px;font-weight:600;letter-spacing:-.035em;color:#fff;">${powerText(totalPower)}</span>
                          </div>
                          <div style="margin-top:6px;font-size:12px;line-height:1.3;color:rgba(255,255,255,.62);">${etaText}</div>
                        </div>
                      </div>

                      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;">
                        ${stack('AC1', soc1, p1)}
                        ${stack('AC2', soc2, p2)}
                        ${stack('AC3', soc3, p3)}
                      </div>
                    </div>`;
                ]]]
            styles:
              card:
                - padding: 18px
                - border-radius: 26px
                - background: >-
                    linear-gradient(145deg, rgba(29,31,34,0.99) 0%, rgba(15,16,18,0.995) 100%)
                - border: 1px solid rgba(255,255,255,0.065)
                - box-shadow: 0 12px 32px rgba(0,0,0,0.25)
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto
              custom_fields:
                content:
                  - width: 100%

          - type: tile
            entity: binary_sensor.energy_planner_headroom_risk_today
            name: Headroom Risk Today
            icon: mdi:battery-alert
            vertical: false

          - type: tile
            entity: sensor.energy_planner_whole_bank_soc
            name: Battery Now
            icon: mdi:battery
            vertical: false

          - type: tile
            entity: sensor.energy_planner_battery_headroom
            name: Battery Headroom
            icon: mdi:battery-plus-outline
            vertical: false

          - type: tile
            entity: sensor.energy_planner_rolling_headroom_shortfall
            name: Modeled Headroom Shortfall
            icon: mdi:battery-minus-outline
            vertical: false

          - type: tile
            entity: sensor.energy_planner_rolling_risk_day_capacity_export
            name: Capacity-Limited Export Risk
            icon: mdi:transmission-tower-export
            vertical: false

          - type: button
            name: Energy History Export
            icon: mdi:history
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: >-
                /history?entity_id=sensor.envoy_482538078562_current_net_power_consumption%2Csensor.envoy_482538078562_current_power_production%2Csensor.ecoflow_smart_home_panel_2_grid_power%2Csensor.ecoflow_smart_home_panel_2_home_power%2Csensor.ecoflow_delta_pro_ultra_battery%2Csensor.ecoflow_delta_pro_ultra_battery_2%2Csensor.ecoflow_delta_pro_ultra_battery_3%2Cnumber.ecoflow_smart_home_panel_2_charging_power%2Cnumber.ecoflow_smart_home_panel_2_backup_reserve_level%2Csensor.solar_actual_power%2Csensor.solar_forecast_power_now%2Csensor.energy_production_today%2Csensor.energy_production_today_remaining%2Csensor.energy_production_tomorrow%2Csensor.house_end_use_power%2Csensor.forecast_base_load_3h_average%2Csensor.forecast_base_load_24h_average%2Csensor.energy_planner_whole_bank_soc%2Csensor.energy_planner_battery_headroom%2Csensor.energy_planner_rolling_headroom_shortfall%2Csensor.energy_planner_rolling_risk_day_capacity_export%2Csensor.energy_planner_rolling_headroom_risk_date%2Cbinary_sensor.energy_planner_headroom_risk_today%2Cbinary_sensor.energy_planner_dynamic_load_forecast%2Csensor.energy_planner_ev_soc%2Csensor.car_charger_power%2Csensor.hot_tub_power%2Csensor.hvac_power%2Csensor.networking_servers_power%2Csensor.rear_patio_power%2Csensor.ecoflow_solar_surplus_envoy_realtime_grid_power%2Csensor.ecoflow_solar_surplus_envoy_realtime_solar_power%2Csensor.ecoflow_solar_surplus_site_grid_source%2Csensor.ecoflow_solar_surplus_solar_source%2Csensor.ecoflow_solar_surplus_decision_site_grid_power%2Csensor.ecoflow_solar_surplus_decision_solar_power%2Csensor.ecoflow_solar_surplus_physical_charge_power%2Csensor.ecoflow_solar_surplus_target_charge_power%2Csensor.ecoflow_solar_surplus_charge_power_difference%2Csensor.ecoflow_solar_surplus_decision_policy%2Csensor.ecoflow_solar_surplus_last_decision_time%2Cbinary_sensor.ecoflow_solar_surplus_control_ready%2Cbinary_sensor.ecoflow_solar_surplus_control_active%2Cbinary_sensor.ecoflow_solar_surplus_controller_healthy

      - type: grid
        cards:
          - type: heading
            heading: Dynamic Load Forecast — Next 7 Days
            icon: mdi:calendar-lightning

          - type: markdown
            content: |-
              {% set e = 'binary_sensor.energy_planner_dynamic_load_forecast' %}
              {% set rows = state_attr(e,'days') or [] %}
              {% set risk_dates = state_attr(e,'risk_dates') or [] %}
              {% set next3 = state_attr(e,'dynamic_load_next_3d_kwh') %}
              {% set horizon = state_attr(e,'dynamic_load_horizon_kwh') %}
              {% if rows | count == 0 %}
              ## ⚪ MULTI-DAY FORECAST UNAVAILABLE
              Waiting for enough interval forecast and battery data.
              {% else %}
              {% if risk_dates | count > 0 %}
              ## ⚠️ DYNAMIC LOAD NEEDED
              **Risk days:** {{ risk_dates | join(', ') }}  
              **Useful load needed — next 3 days:** {{ next3 | round(1) if next3 is number else '—' }} kWh  
              **Useful load needed — full horizon:** {{ horizon | round(1) if horizon is number else '—' }} kWh
              {% else %}
              ## 🟢 NO DYNAMIC LOAD NEEDED IN FORECAST HORIZON
              The modeled battery headroom is sufficient if conditions remain as forecast.
              {% endif %}

              | Day | Solar | Start SOC | Sunset SOC | Cap. export | Dynamic load | Decision |
              | --- | ---: | ---: | ---: | ---: | ---: | --- |
              {% for row in rows -%}
              | {{ row.date }} | {{ row.solar_kwh | round(1) }} kWh | {{ row.start_soc_pct | round(0) }}% | {{ row.sunset_soc_pct | round(0) }}% | {{ row.capacity_export_kwh | round(1) }} kWh | {{ row.dynamic_load_needed_kwh | round(1) }} kWh | {% if row.dynamic_load_needed %}⚠️ Use load{% else %}🟢 Clear{% endif %} |
              {% endfor %}
              {% endif %}

          - type: tile
            entity: binary_sensor.energy_planner_dynamic_load_forecast
            name: Any Dynamic Load Needed
            icon: mdi:calendar-alert
            vertical: false

          - type: markdown
            content: >-
              ### How to read this
              **Dynamic load** is the useful AC energy the model expects must be consumed to avoid capacity-driven export.  
              Today uses the locally corrected solar curve. Future days use Forecast.Solar's interval forecast and will change as weather forecasts update.  
              Power/control-limited export is tracked separately and cannot necessarily be eliminated by creating more battery headroom.

      - type: grid
        cards:
          - type: heading
            heading: EV / Flexible Load
            icon: mdi:car-electric

          - type: markdown
            content: >-
              {% set ev = 'binary_sensor.energy_planner_ev_auto_charge_eligible' %}
              {% set status = states('sensor.energy_planner_rolling_ev_advisory_status') %}
              {% set reason = state_attr(ev,'reason') %}
              {% set useful = state_attr(ev,'recommended_energy_kwh') | float(0) %}
              {% if status == 'green' %}
              ## 🟢 EV CHARGING USEFUL
              {% elif status == 'yellow' %}
              ## 🟡 EV CHARGING OPTIONAL
              {% elif status == 'red' %}
              ## 🔴 EV CHARGING NOT NEEDED
              {% else %}
              ## ⚪ EV OUTLOOK UNAVAILABLE
              {% endif %}
              **{{ reason or 'Planner is evaluating the EV as a flexible load.' }}**  
              {% if useful > 0 %}Recommended EV energy: **{{ useful | round(1) }} kWh**{% endif %}

          - type: tile
            entity: sensor.energy_planner_ev_soc
            name: Lexus SOC
            icon: mdi:car-battery
            vertical: false

          - type: tile
            entity: binary_sensor.energy_planner_ev_auto_charge_eligible
            name: Auto-Charge Eligible
            icon: mdi:ev-station
            vertical: false

          - type: tile
            entity: sensor.energy_planner_ev_available_energy_to_target
            name: EV Energy Available
            icon: mdi:battery-arrow-up-outline
            vertical: false

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_ev_auto_charge_eligible' %}
              {% set learned = state_attr(e,'learned_charge_power_w') %}
              {% set source = state_attr(e,'learned_charge_power_source') %}
              ### Learned charge power
              **{{ (learned / 1000) | round(2) if learned is number else '—' }} kW**  
              {{ source | replace('_',' ') | title if source else 'Waiting for charge-power learning data' }}

          - type: tile
            entity: sensor.car_charger_power
            name: Charger Now
            icon: mdi:lightning-bolt
            vertical: false

          - type: tile
            entity: sensor.energy_planner_recommended_ev_charge_energy
            name: Recommended EV Energy
            icon: mdi:battery-charging-medium
            vertical: false

          - type: tile
            entity: sensor.energy_planner_recommended_ev_preserved_battery_headroom
            name: Headroom Preserved by EV
            icon: mdi:battery-sync-outline
            vertical: false

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_ev_auto_charge_eligible' %}
              {% set start = state_attr(e,'preferred_window_start') %}
              {% set end = state_attr(e,'preferred_window_end') %}
              {% set solar = state_attr(e,'preferred_window_solar_fraction_pct') %}
              ### Preferred EV charging window
              {% if start and end %}
              **{{ as_local(as_datetime(start)).strftime('%-I:%M %p') }} – {{ as_local(as_datetime(end)).strftime('%-I:%M %p') }}**  
              Solar supplied: **{{ solar | round(0) if solar is number else '—' }}%**
              {% else %}
              No EV charging window is currently required or available.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Solar & Forecast Quality
            icon: mdi:weather-sunny

          - type: markdown
            content: >-
              {% set e = 'binary_sensor.energy_planner_next_sunset_forecast_available' %}
              {% set d = state_attr(e,'date') %}
              {% set soc = state_attr(e,'soc_pct') %}
              {% set charge = state_attr(e,'expected_charge_kwh') %}
              {% set export = state_attr(e,'expected_export_kwh') %}
              ### Next sunset{% if d %} — {{ d }}{% endif %}
              **Projected SOC:** {{ soc | round(1) if soc is number else '—' }}%  
              **Expected battery gain:** {{ charge | round(1) if charge is number else '—' }} kWh  
              **Expected export:** {{ export | round(1) if export is number else '—' }} kWh

          - type: tile
            entity: sensor.energy_planner_forecast_solar_enhancement_status
            name: Forecast.Solar
            icon: mdi:weather-sunny-alert
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_solar_paid_raw_remaining_today
            name: Raw Remaining Today
            icon: mdi:solar-power-variant
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_solar_shadow_energy_scale_factor
            name: Local / Forecast.Solar Scale
            icon: mdi:scale-balance
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_solar_interval_resolution
            name: Forecast Resolution
            icon: mdi:timeline-clock-outline
            vertical: false

          - type: tile
            entity: sensor.energy_planner_forecast_calibration_status
            name: Calibration Status
            icon: mdi:chart-timeline-variant-shimmer
            vertical: false

          - type: tile
            entity: sensor.energy_planner_daylight_stored_energy_forecast_mae
            name: Daylight Forecast MAE
            icon: mdi:chart-line-variant
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: Realtime Solar Controller
            icon: mdi:transmission-tower

          - type: markdown
            content: >-
              {% set healthy = is_state('binary_sensor.ecoflow_solar_surplus_controller_healthy','on') %}
              {% set grid_source = states('sensor.ecoflow_solar_surplus_site_grid_source') %}
              {% set solar_source = states('sensor.ecoflow_solar_surplus_solar_source') %}
              {% set grid = states('sensor.ecoflow_solar_surplus_decision_site_grid_power') %}
              {% set solar = states('sensor.ecoflow_solar_surplus_decision_solar_power') %}
              {% set policy = states('sensor.ecoflow_solar_surplus_decision_policy') %}
              {% if healthy %}
              ## 🟢 REALTIME CONTROLLER HEALTHY
              {% else %}
              ## 🟡 CHECK CONTROLLER TELEMETRY
              {% endif %}
              **Grid source:** {{ grid_source | replace('_',' ') | title if grid_source not in ['unknown','unavailable'] else 'Unavailable' }}  
              **Solar source:** {{ solar_source | replace('_',' ') | title if solar_source not in ['unknown','unavailable'] else 'Unavailable' }}  
              **Decision grid:** {{ (grid | float(0)) | round(0) if grid not in ['unknown','unavailable'] else '—' }} W  
              **Decision solar:** {{ (solar | float(0)) | round(0) if solar not in ['unknown','unavailable'] else '—' }} W  
              **Policy:** {{ policy | replace('_',' ') if policy not in ['unknown','unavailable'] else '—' }}

          - type: tile
            entity: binary_sensor.ecoflow_solar_surplus_controller_healthy
            name: Controller Healthy
            icon: mdi:heart-pulse
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_site_grid_source
            name: Grid Source
            icon: mdi:transmission-tower-import
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_solar_source
            name: Solar Source
            icon: mdi:solar-power-variant
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_envoy_realtime_grid_power
            name: Envoy Realtime Grid
            icon: mdi:transmission-tower
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_envoy_realtime_solar_power
            name: Envoy Realtime Solar
            icon: mdi:solar-power
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_decision_site_grid_power
            name: Grid Used by Controller
            icon: mdi:meter-electric
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_target_charge_power
            name: Target Charge Power
            icon: mdi:battery-charging
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_physical_charge_power
            name: Physical Charge Power
            icon: mdi:battery-charging-high
            vertical: false

          - type: tile
            entity: sensor.ecoflow_solar_surplus_last_decision_time
            name: Last Controller Decision
            icon: mdi:clock-check-outline
            vertical: false
