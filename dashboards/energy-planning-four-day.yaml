    - type: custom:button-card
      entity: binary_sensor.energy_planner_ev_auto_charge_eligible
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      triggers_update: all
      custom_fields:
        content: "[[[\n  const eligibility = states['binary_sensor.energy_planner_ev_auto_charge_eligible'];\n \
          \ const attrs = eligibility?.attributes || {};\n  const read = id => states[id]?.state;\n  const numeric\
          \ = value => {\n    const n = Number(value);\n    return value !== undefined && value !== null && value\
          \ !== '' && Number.isFinite(n) ? n : null;\n  };\n  const display = (value, digits=0) => {\n    const\
          \ n = numeric(value);\n    return n === null ? '—' : n.toLocaleString(undefined, {maximumFractionDigits:digits});\n\
          \  };\n  const soc = numeric(read('sensor.energy_planner_ev_soc'));\n  const available = numeric(read('sensor.energy_planner_ev_available_energy_to_target'));\n\
          \  const fullEnergy = numeric(read('sensor.energy_planner_ev_learned_full_range_wall_energy'));\n  const\
          \ chargeRate = numeric(attrs.learned_charge_power_w);\n  const currentPower = numeric(attrs.ev_current_power_w);\n\
          \  const source = states[attrs.ev_soc_entity];\n  const sourceName = source?.attributes?.friendly_name\
          \ || '';\n  const findRange = (label) => {\n    if (!sourceName) return null;\n    const expected = sourceName.replace(/\
          \ EV Battery Level /i, ` EV ${label} `).toLowerCase();\n    const found = Object.values(states).find(s\
          \ =>\n      (s?.attributes?.friendly_name || '').toLowerCase() === expected &&\n      !['unknown','unavailable',''].includes(String(s.state).toLowerCase())\n\
          \    );\n    return found || null;\n  };\n  const range = findRange('Range');\n  const rangeAc = findRange('Range\
          \ AC');\n  const rangeLabel = entity => entity ? `${display(entity.state, 0)} ${entity.attributes.unit_of_measurement\
          \ || ''}`.trim() : 'Unavailable';\n  const lockState = states[attrs.ev_lock_entity]?.state;\n  const lockStatus\
          \ = lockState === 'locked' ? 'LOCKED' : lockState === 'unlocked' ? 'UNLOCKED' : 'LOCK STATUS UNAVAILABLE';\n\
          \  const lockIcon = lockState === 'locked' ? 'mdi:lock' : lockState === 'unlocked' ? 'mdi:lock-open-variant'\
          \ : 'mdi:lock-question';\n  const homeEntity = states[attrs.ev_home_entity];\n  const status = currentPower\
          \ !== null && currentPower >= 50 ? 'CHARGING' :\n    homeEntity?.state === 'home' ? 'AT HOME' : homeEntity?.state\
          \ === 'not_home' ? 'AWAY' : 'STATUS UNKNOWN';\n  const bar = soc === null ? 0 : Math.max(0, Math.min(100,\
          \ soc));\n  const esc = value => String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"\
          ':'&quot;',\"'\":'&#39;'}[ch]));\n  const stat = (label, value, hint='') => `\n    <div style=\"min-width:0;padding:11px\
          \ 12px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055)\"\
          >\n      <div style=\"font-size:10px;letter-spacing:.09em;color:#8e9298;font-weight:700\">${label}</div>\n\
          \      <div style=\"font-size:17px;font-weight:750;color:#f4f4f5;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\"\
          >${value}</div>\n      ${hint ? `<div style=\"font-size:10px;color:#8e9298;margin-top:3px\">${hint}</div>`\
          \ : ''}\n    </div>`;\n  return `\n    <div style=\"font-family:system-ui,-apple-system,sans-serif;color:#f4f4f5\"\
          >\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n    \
          \    <div style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n          <ha-icon icon=\"mdi:car-electric\"\
          \ style=\"width:22px;height:22px;color:#64d2ff\"></ha-icon>\n          <div style=\"font-size:16px;font-weight:750\"\
          >Lexus EV</div>\n        </div>\n        <div style=\"font-size:9px;letter-spacing:.08em;color:#64d2ff;border:1px\
          \ solid rgba(100,210,255,.25);background:rgba(100,210,255,.08);border-radius:20px;padding:5px 8px;white-space:nowrap\"\
          >${status}</div>\n      </div>\n      <div style=\"display:flex;align-items:center;gap:6px;margin-top:9px;color:#b8bbc1;font-size:11px\"\
          >\n        <ha-icon icon=\"${lockIcon}\" style=\"width:15px;height:15px;color:${lockState === 'locked'\
          \ ? '#30d158' : lockState === 'unlocked' ? '#ff9f0a' : '#8e9298'}\"></ha-icon>\n        <span>${lockStatus}</span>\n\
          \      </div>\n      <div style=\"margin-top:15px;display:flex;align-items:baseline;justify-content:space-between\"\
          >\n        <div style=\"font-size:11px;letter-spacing:.09em;color:#a1a1aa;font-weight:700\">STATE OF CHARGE</div>\n\
          \        <div style=\"font-size:23px;font-weight:800\">${soc === null ? '—' : `${display(soc)}%`}</div>\n\
          \      </div>\n      <div style=\"height:7px;background:rgba(255,255,255,.09);border-radius:8px;overflow:hidden;margin:7px\
          \ 0 13px\">\n        <div style=\"width:${bar}%;height:100%;background:linear-gradient(90deg,#30d158,#64d2ff);border-radius:8px\"\
          ></div>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\"\
          >\n        ${stat('RANGE', esc(rangeLabel(range)))}\n        ${stat('RANGE WITH A/C', esc(rangeLabel(rangeAc)))}\n\
          \        ${stat('ENERGY TO TARGET', available === null ? '—' : `${display(available,1)} kWh`)}\n     \
          \   ${stat('CHARGE RATE', chargeRate === null ? '—' : `${display(chargeRate / 1000,2)} kW`, attrs.learned_charge_power_source\
          \ ? esc(attrs.learned_charge_power_source) : 'learned')}\n        ${stat('CURRENT CHARGE', currentPower\
          \ === null ? '—' : `${display(currentPower / 1000,2)} kW`)}\n        ${stat('FULL CHARGE ENERGY', fullEnergy\
          \ === null ? '—' : `${display(fullEnergy,1)} kWh`)}\n      </div>\n      <div style=\"font-size:10px;color:#777c84;margin-top:11px;text-align:right\"\
          >Vehicle data · Toyota Connected Services</div>\n    </div>\n  `;\n]]]\n"
