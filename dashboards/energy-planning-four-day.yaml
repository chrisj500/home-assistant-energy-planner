# Optional standalone dashboard. Four-Day Plan is also a tab in energy-planning.yaml.
views:
- title: Four-Day Plan
  path: four-day-plan
  icon: mdi:calendar-multiselect
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: HVAC Overview
      icon: mdi:thermostat
    - type: custom:button-card
      entity: climate.thermostat
      triggers_update: all
      show_name: false
      show_icon: false
      tap_action:
        action: more-info
      styles:
        card:
        - padding: 14px
        - border-radius: 28px
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - white-space: normal
          - text-align: center
          - min-width: 0
      custom_fields:
        content: "[[[\n  const esc = x => String(x ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"\
          ':'&quot;',\"'\":'&#39;'}[c]));\n  const num = x => x !== null && x !== undefined && x !== '' && Number.isFinite(Number(x))\
          \ ? Number(x) : null;\n  const avg = values => {\n    const valid = values.filter(v => v !== null);\n\
          \    return valid.length ? valid.reduce((a,b) => a + b, 0) / valid.length : null;\n  };\n  const t = states['climate.thermostat'];\n\
          \  const a = t?.attributes || {};\n  const valid = t && !['unknown','unavailable'].includes(t.state);\n\
          \  const action = valid ? (a.hvac_action || '') : '';\n  const actionModes = {\n    cooling: ['Cooling','mdi:snowflake','#64c7ff'],\n\
          \    heating: ['Heating','mdi:fire','#ffac66'],\n    fan: ['Fan only','mdi:fan','#7bddbf'],\n    idle:\
          \ ['Idle','mdi:pause-circle-outline','#c5cbd5'],\n    off: ['Off','mdi:power','#c5cbd5'],\n    drying:\
          \ ['Drying','mdi:water-percent','#aab2ff'],\n    defrosting: ['Defrosting','mdi:snowflake-melt','#aab2ff']\n\
          \  };\n  const thermostatModes = {\n    cool: ['Cool mode','mdi:snowflake','#64c7ff'],\n    heat: ['Heat\
          \ mode','mdi:fire','#ffac66'],\n    fan_only: ['Fan only','mdi:fan','#7bddbf'],\n    dry: ['Dry mode','mdi:water-percent','#aab2ff'],\n\
          \    heat_cool: ['Auto mode','mdi:autorenew','#c5cbd5'],\n    off: ['Off','mdi:power','#c5cbd5']\n  };\n\
          \  const [label, icon, color] = !valid\n    ? ['State unavailable','mdi:help-circle-outline','#c5cbd5']\n\
          \    : (actionModes[action] || thermostatModes[t.state] || [`${String(t.state || 'Mode').replaceAll('_','\
          \ ')} mode`,'mdi:thermostat','#c5cbd5']);\n  const unit = a.temperature_unit || hass.config.unit_system.temperature;\n\
          \  const current = valid ? num(a.current_temperature) : null;\n  const target = num(a.temperature);\n\
          \  const targetLow = num(a.target_temp_low);\n  const targetHigh = num(a.target_temp_high);\n  const fmt\
          \ = x => x === null ? '—' : x.toFixed(1);\n  const setpoint = target !== null ? `${fmt(target)}${esc(unit)}`\
          \ :\n    (targetLow !== null && targetHigh !== null ? `${fmt(targetLow)}–${fmt(targetHigh)}${esc(unit)}`\
          \ : '—');\n\n  const roomState = (room, metric) => {\n    const suffix = `${room}_${metric}`;\n    const\
          \ candidates = [\n      `sensor.homepod_indoor_climate_${suffix}`,\n      `sensor.home_homepod_indoor_climate_${suffix}`\n\
          \    ];\n    for (const id of candidates) {\n      if (states[id]) return [id, states[id]];\n    }\n \
          \   const id = Object.keys(states).find(\n      key => key.startsWith('sensor.') &&\n        key.includes('homepod_indoor_climate')\
          \ &&\n        key.endsWith(`_${suffix}`)\n    );\n    return id ? [id, states[id]] : [null, null];\n \
          \ };\n  const reading = (room, metric) => {\n    const [id, s] = roomState(room, metric);\n    if (!s\
          \ || ['unknown','unavailable'].includes(s.state)) {\n      return {id, value:null, unit:'', fresh:false};\n\
          \    }\n    const last = s.attributes?.last_received;\n    const age = last ? (Date.now() - Date.parse(last))\
          \ / 60000 : null;\n    const freshFlag = s.attributes?.fresh;\n    const fresh = freshFlag !== false &&\
          \ (age === null || (Number.isFinite(age) && age >= 0 && age <= 15));\n    return {\n      id,\n      value:\
          \ fresh ? num(s.state) : null,\n      unit: s.attributes?.unit_of_measurement || (metric === 'humidity'\
          \ ? '%' : unit),\n      fresh\n    };\n  };\n  const room = key => ({\n    temperature: reading(key, 'temperature'),\n\
          \    humidity: reading(key, 'humidity')\n  });\n  const living = room('living_room');\n  const guest =\
          \ room('guest_bedroom');\n  const mainLeft = room('main_bedroom_left');\n  const mainRight = room('main_bedroom_right');\n\
          \  const mainTemp = avg([mainLeft.temperature.value, mainRight.temperature.value]);\n  const mainHumidity\
          \ = avg([mainLeft.humidity.value, mainRight.humidity.value]);\n  const mainCount = [mainLeft.temperature.value,\
          \ mainRight.temperature.value].filter(v => v !== null).length;\n  const houseTemp = avg([living.temperature.value,\
          \ guest.temperature.value, mainTemp]);\n  const houseHumidity = avg([living.humidity.value, guest.humidity.value,\
          \ mainHumidity]);\n  const houseCount = [living.temperature.value, guest.temperature.value, mainTemp].filter(v\
          \ => v !== null).length;\n  const roomCard = (name, temperature, humidity, note='') => {\n    const hasValue\
          \ = temperature !== null || humidity !== null;\n    return `<div style=\"padding:8px 7px;background:var(--secondary-background-color);border-radius:12px;min-height:68px\"\
          ><div style=\"font-size:11px;line-height:1.25\">${esc(name)}</div><div style=\"font-size:19px;font-weight:650;margin-top:3px\"\
          >${fmt(temperature)}${temperature === null ? '' : esc(unit)}</div><div style=\"font-size:10px;margin-top:2px;color:var(--secondary-text-color)\"\
          >${humidity === null ? '—' : `${fmt(humidity)}% RH`}</div>${!hasValue ? '<div style=\"font-size:12px;margin-top:4px\"\
          >Missing or stale</div>' : note ? `<div style=\"font-size:9px;margin-top:3px;color:var(--secondary-text-color)\"\
          >${esc(note)}</div>` : ''}</div>`;\n  };\n  const rooms = [\n    roomCard('Main bedroom', mainTemp, mainHumidity,\
          \ mainCount === 2 ? 'Left + right average' : `${mainCount}/2 HomePods available`),\n    roomCard('Guest\
          \ bedroom', guest.temperature.value, guest.humidity.value),\n    roomCard('Living room', living.temperature.value,\
          \ living.humidity.value),\n    roomCard('House average', houseTemp, houseHumidity, `${houseCount}/3 physical\
          \ rooms`)\n  ].join('');\n\n  const p = num(states['sensor.energy_planner_hvac_electrical_power']?.state);\n\
          \  const e = states['sensor.energy_planner_hvac_daily_electricity'];\n  const kwh = num(e?.state);\n \
          \ const coverage = num(e?.attributes.coverage_percent);\n  const energyLabel = kwh === null ? 'Unavailable'\
          \ : `${kwh.toFixed(2)} kWh`;\n  const powerLabel = p === null ? 'Unavailable' : p >= 1000 ? `${(p/1000).toFixed(2)}\
          \ kW` : `${Math.round(p)} W`;\n  const BASE_IMPORT_RATE_USD_PER_KWH = 0.25;\n  const costToday = kwh ===\
          \ null ? null : kwh * BASE_IMPORT_RATE_USD_PER_KWH;\n  const costTodayLabel = costToday === null\n   \
          \ ? 'Cost unavailable'\n    : 'Estimated cost today $' + costToday.toFixed(2) + ' @ $' + BASE_IMPORT_RATE_USD_PER_KWH.toFixed(2)\
          \ + '/kWh';\n  const model = states['sensor.energy_planner_hvac_model_status'];\n  const m = model?.attributes\
          \ || {};\n  const configuredOutdoorId = m?.entities?.hvac_outdoor_temperature || 'sensor.ecowitt_outdoor_temperature';\n\
          \  const configuredWeatherId = m?.entities?.hvac_weather || 'weather.forecast_home';\n  const outdoorState\
          \ = states[configuredOutdoorId];\n  const weatherState = states[configuredWeatherId];\n  const convertTemp\
          \ = (value, fromUnit, toUnit) => {\n    if (value === null) return null;\n    if (!fromUnit || fromUnit\
          \ === toUnit) return value;\n    if (fromUnit === '°C' && toUnit === '°F') return value * 1.8 + 32;\n\
          \    if (fromUnit === '°F' && toUnit === '°C') return (value - 32) / 1.8;\n    return null;\n  };\n  const\
          \ outdoorRaw = outdoorState && !['unknown','unavailable'].includes(outdoorState.state) ? num(outdoorState.state)\
          \ : null;\n  const outdoor = convertTemp(outdoorRaw, outdoorState?.attributes?.unit_of_measurement, unit);\n\
          \  const outdoorDelta = outdoor !== null && target !== null ? outdoor - target : null;\n  const insideHumidity\
          \ = num(a.current_humidity);\n  const outsideHumidity = weatherState && !['unknown','unavailable'].includes(weatherState.state)\n\
          \    ? num(weatherState.attributes?.humidity)\n    : null;\n  const humidityDelta = outsideHumidity !==\
          \ null && insideHumidity !== null\n    ? outsideHumidity - insideHumidity\n    : null;\n  const signed\
          \ = value => value === null ? '—' : `${value > 0 ? '+' : ''}${value.toFixed(1)}`;\n  const outdoorLine\
          \ = outdoor === null\n    ? 'Outside temperature unavailable'\n    : `Outside ${fmt(outdoor)}${esc(unit)}\
          \ · Target ${target === null ? '—' : `${fmt(target)}${esc(unit)}`} · Δ ${signed(outdoorDelta)}${esc(unit)}`;\n\
          \  const humidityLine = outsideHumidity === null || insideHumidity === null\n    ? 'Outside / inside humidity\
          \ unavailable'\n    : `Outside RH ${outsideHumidity.toFixed(1)}% · Inside RH ${insideHumidity.toFixed(1)}%\
          \ · Δ ${signed(humidityDelta)} pts`;\n  const recovery = m?.recovery || {};\n  const thermal = m?.thermal\
          \ || {};\n  const rateFactor = unit === '°F' ? 1.8 : 1;\n  const recoveryEta = num(recovery.eta_minutes);\n\
          \  const recoveryRate = num(recovery.rate_c_per_hour);\n  const recoveryCycles = num(recovery.completed_cycles)\
          \ ?? 0;\n\n  let demandAction = null;\n  let demandGap = null;\n  if (valid && current !== null) {\n \
          \   if (t.state === 'cool' && target !== null && current > target + 0.05) {\n      demandAction = 'cooling';\n\
          \      demandGap = current - target;\n    } else if (t.state === 'heat' && target !== null && current\
          \ < target - 0.05) {\n      demandAction = 'heating';\n      demandGap = target - current;\n    } else\
          \ if (t.state === 'heat_cool' && targetLow !== null && current < targetLow - 0.05) {\n      demandAction\
          \ = 'heating';\n      demandGap = targetLow - current;\n    } else if (t.state === 'heat_cool' && targetHigh\
          \ !== null && current > targetHigh + 0.05) {\n      demandAction = 'cooling';\n      demandGap = current\
          \ - targetHigh;\n    }\n  }\n\n  const learnedRateC = demandAction ? num(recovery?.models?.[demandAction]?.rate_c_per_hour)\
          \ : null;\n  let bestEta = recoveryEta !== null && recoveryEta > 0\n    ? recoveryEta\n    : (demandGap\
          \ !== null && learnedRateC !== null && learnedRateC > 0\n      ? demandGap / (learnedRateC * rateFactor)\
          \ * 60\n      : null);\n  if (bestEta !== null && (!Number.isFinite(bestEta) || bestEta <= 0)) bestEta\
          \ = null;\n  if (bestEta !== null) bestEta = Math.min(360, bestEta);\n  const etaMinutes = bestEta ===\
          \ null ? null : Math.max(1, Math.round(bestEta));\n  const etaLabel = etaMinutes === null\n    ? ''\n\
          \    : etaMinutes < 60\n      ? `≈ ${etaMinutes} min to target`\n      : `≈ ${Math.floor(etaMinutes /\
          \ 60)} hr ${etaMinutes % 60 ? `${etaMinutes % 60} min ` : ''}to target`;\n\n  const recoveryLine = recovery.active\n\
          \    ? recoveryEta !== null\n      ? `Recovery ETA ${Math.round(recoveryEta)} min · ${(recoveryRate *\
          \ rateFactor).toFixed(1)}${esc(unit)}/h · ${esc(recovery.status || recovery.source || 'estimate')}`\n\
          \      : `Recovery ${esc(recovery.status || 'learning')} · ${recoveryCycles} completed calls`\n    : `Recovery\
          \ model · ${recoveryCycles} completed calls`;\n  const thermalDrift = num(thermal.predicted_drift_c_per_hour);\n\
          \  const thermalTau = num(thermal.time_constant_hours);\n  const thermalSamples = num(thermal.samples)\
          \ ?? 0;\n  const thermalRequired = num(thermal.samples_required) ?? 3;\n  const thermalLine = thermalDrift\
          \ !== null\n    ? `Passive thermal drift ${signed(thermalDrift * rateFactor)}${esc(unit)}/h at current\
          \ ΔT · τ ${thermalTau?.toFixed(1) ?? '—'} h · ${esc(thermal.status || thermal.source || 'estimate')}`\n\
          \    : `Passive thermal model ${esc(thermal.status || 'learning')} · ${thermalSamples}/${thermalRequired}\
          \ completed idle windows`;\n  const learningState = model?.state || 'unavailable';\n  const learningSamples\
          \ = num(m.learning_samples) ?? 0;\n  const learningSamplesRequired = num(m.learning_samples_required)\
          \ ?? 36;\n  const learningDays = num(m.learning_days) ?? 0;\n  const learningDaysRequired = num(m.learning_days_required)\
          \ ?? 3;\n  const learningPct = num(m.learning_progress_pct) ?? 0;\n  const learningColor = learningState\
          \ === 'ready' ? '#30d158' : learningState === 'suspected_fault' || learningState === 'unavailable' ? '#ff453a'\
          \ : '#ffd60a';\n  const hourlySupported = num(m.hourly_supported_hours) ?? 0;\n  const hourlyTotal = num(m.hourly_forecast_hours)\
          \ ?? 0;\n  const sourceData = states['sensor.energy_planner_hvac_electrical_power']?.attributes?.power_sources\
          \ || {};\n  const sourceItems = Object.values(sourceData);\n  const sourceIssues = sourceItems.filter(x\
          \ => x && x.available === false).map(x => `${esc(x.entity_id)}: ${esc(x.raw_state)} (${esc(x.reason)})`);\n\
          \  const sourceLabel = !sourceItems.length ? 'Power source diagnostics unavailable' : sourceIssues.length\
          \ ? sourceIssues.join(' · ') : 'Condenser and blower/control sources available';\n\n  return `<div style=\"\
          color:var(--primary-text-color);font-family:inherit\">\n    <div style=\"display:flex;align-items:center;justify-content:center;gap:7px;color:${color};font-size:18px;font-weight:650\"\
          ><ha-icon icon=\"${icon}\" style=\"width:26px\"></ha-icon>${label}</div>\n    <div style=\"font-size:10px;margin-top:4px\"\
          >Thermostat-reported state · Mode: ${esc(valid ? t.state : 'unknown')}</div>\n    <div style=\"position:relative;width:min(100%,205px);aspect-ratio:1;margin:10px\
          \ auto\">\n      <svg viewBox=\"0 0 240 240\" style=\"width:100%;height:100%\" aria-hidden=\"true\"><circle\
          \ cx=\"120\" cy=\"120\" r=\"105\" fill=\"none\" stroke=\"var(--divider-color)\" stroke-width=\"12\"/><circle\
          \ cx=\"120\" cy=\"120\" r=\"105\" fill=\"none\" stroke=\"${color}\" stroke-width=\"12\" stroke-linecap=\"\
          round\" stroke-dasharray=\"495 660\" transform=\"rotate(135 120 120)\"/><circle cx=\"120\" cy=\"120\"\
          \ r=\"89\" fill=\"none\" stroke=\"var(--divider-color)\" stroke-width=\"1\"/></svg>\n      <div style=\"\
          position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center\"\
          ><div style=\"font-size:10px;letter-spacing:1px\">THERMOSTAT</div><div style=\"font-size:39px;font-weight:650;margin:4px\
          \ 0\">${fmt(current)}<span style=\"font-size:16px\">${esc(unit)}</span></div><div style=\"font-size:13px\"\
          >Target ${setpoint}</div>${etaLabel ? `<div style=\"font-size:11px;font-weight:650;margin-top:4px\">${etaLabel}</div>`\
          \ : ''}<div style=\"font-size:11px;margin-top:5px\">Humidity ${fmt(num(a.current_humidity))}%</div></div>\n\
          \    </div>\n    <div style=\"margin:0 0 10px;padding:7px 9px;border-radius:12px;background:var(--secondary-background-color);font-size:10px;line-height:1.45;color:var(--secondary-text-color)\"\
          >\n      <div><ha-icon icon=\"mdi:thermometer\" style=\"width:16px;margin-right:4px\"></ha-icon>${outdoorLine}</div>\n\
          \      <div><ha-icon icon=\"mdi:water-percent\" style=\"width:16px;margin-right:4px\"></ha-icon>${humidityLine}</div>\n\
          \    </div>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">${rooms}</div>\n\
          \    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:11px;border-top:1px\
          \ solid var(--divider-color);padding-top:11px\"><div><div style=\"font-size:13px\">Electricity now</div><div\
          \ style=\"font-size:19px;font-weight:650;margin-top:3px\">${powerLabel}</div></div><div><div style=\"\
          font-size:13px\">Electricity today</div><div style=\"font-size:19px;font-weight:650;margin-top:3px\">${energyLabel}</div></div><div\
          \ style=\"grid-column:1 / -1;font-size:9px;color:var(--secondary-text-color);margin-top:0\">${costTodayLabel}</div></div>\n\
          \    <div style=\"margin-top:9px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.045);text-align:left\"\
          >\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><span style=\"\
          font-size:10px;font-weight:700\">HVAC learner</span><span style=\"font-size:10px;font-weight:750;color:${learningColor}\"\
          >${esc(learningState)}</span></div>\n      <div style=\"margin-top:4px;font-size:9px;line-height:1.4;color:rgba(255,255,255,.60)\"\
          >${learningSamples}/${learningSamplesRequired} samples · ${learningDays}/${learningDaysRequired} days\
          \ · ${learningPct.toFixed(0)}% ready</div>\n    </div>\n  </div>`;\n]]]\n"
  - type: grid
    cards:
    - type: heading
      heading: Headroom Decision
      icon: mdi:battery-alert-variant-outline
    - type: custom:button-card
      entity: sensor.ecoflow_smart_home_panel_2_backup_battery
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      triggers_update:
      - sensor.ecoflow_smart_home_panel_2_backup_battery
      - sensor.energy_planner_whole_bank_soc
      - sensor.energy_planner_effective_battery_capacity
      - sensor.energy_planner_battery_pack_count
      - sensor.energy_planner_battery_topology_source
      - sensor.ecoflow_smart_home_panel_2_ac1_battery
      - sensor.ecoflow_smart_home_panel_2_ac1_power
      - sensor.ecoflow_smart_home_panel_2_ac2_battery
      - sensor.ecoflow_smart_home_panel_2_ac2_power
      - sensor.ecoflow_smart_home_panel_2_ac3_battery
      - sensor.ecoflow_smart_home_panel_2_ac3_power
      - sensor.patio_ecoflow_smart_home_panel_2_backup_charge_time_remaining
      - number.ecoflow_smart_home_panel_2_backup_reserve_level
      custom_fields:
        content: "[[[\n  const num = (id) => {\n    const s = states[id];\n\n    if (\n      !s ||\n      ['unknown','unavailable'].includes(s.state)\n\
          \    ) {\n      return null;\n    }\n\n    const n = Number(s.state);\n    return Number.isFinite(n) ?\
          \ n : null;\n  };\n\n  const soc =\n    num(\n      'sensor.energy_planner_whole_bank_soc'\n    ) ??\n\
          \    num(\n      'sensor.ecoflow_smart_home_panel_2_backup_battery'\n    );\n\n  const capacity =\n  \
          \  num(\n      'sensor.energy_planner_effective_battery_capacity'\n    );\n\n  const packCount =\n   \
          \ num(\n      'sensor.energy_planner_battery_pack_count'\n    );\n\n  const topologySource =\n    states['sensor.energy_planner_battery_topology_source']?.state;\n\
          \n  const bankSubtitle = [\n    'EcoFlow Smart Home Panel 2',\n    packCount === null ? null : `${Math.round(packCount)}\
          \ packs`,\n    capacity === null ? null : `${capacity.toFixed(1)} kWh`\n  ].filter(Boolean).join(' · ');\n\
          \n  const soc1 =\n    num(\n      'sensor.ecoflow_smart_home_panel_2_ac1_battery'\n    );\n\n  const soc2\
          \ =\n    num(\n      'sensor.ecoflow_smart_home_panel_2_ac2_battery'\n    );\n\n  const soc3 =\n    num(\n\
          \      'sensor.ecoflow_smart_home_panel_2_ac3_battery'\n    );\n\n  const p1 =\n    num(\n      'sensor.ecoflow_smart_home_panel_2_ac1_power'\n\
          \    ) ?? 0;\n\n  const p2 =\n    num(\n      'sensor.ecoflow_smart_home_panel_2_ac2_power'\n    ) ??\
          \ 0;\n\n  const p3 =\n    num(\n      'sensor.ecoflow_smart_home_panel_2_ac3_power'\n    ) ?? 0;\n\n \
          \ const eta =\n    num(\n      'sensor.patio_ecoflow_smart_home_panel_2_backup_charge_time_remaining'\n\
          \    );\n\n  const reserveLevel =\n    num(\n      'number.ecoflow_smart_home_panel_2_backup_reserve_level'\n\
          \    );\n\n  const totalPower = p1 + p2 + p3;\n\n  const charging = totalPower > 50;\n  const discharging\
          \ = totalPower < -50;\n\n  const flowAccent =\n    charging\n      ? '#41e66f'\n      : discharging\n\
          \        ? '#68a8ff'\n        : '#a8adb5';\n\n  const status =\n    charging\n      ? 'CHARGING'\n   \
          \   : discharging\n        ? 'DISCHARGING'\n        : 'IDLE';\n\n  const statusIcon =\n    charging\n\
          \      ? 'mdi:lightning-bolt'\n      : discharging\n        ? 'mdi:home-lightning-bolt-outline'\n    \
          \    : 'mdi:power-sleep';\n\n  const clamp = (v) =>\n    v === null\n      ? 0\n      : Math.max(0,Math.min(100,v));\n\
          \n  const socText = (v) =>\n    v === null\n      ? '—'\n      : `${Math.round(v)}%`;\n\n  const powerText\
          \ = (p) => {\n    const a = Math.abs(p);\n\n    return a >= 1000\n      ? `${(a / 1000).toFixed(2)} kW`\n\
          \      : `${Math.round(a)} W`;\n  };\n\n  const formatEta = (minutes) => {\n\n    if (\n      minutes\
          \ === null ||\n      minutes <= 0\n    ) {\n      return 'Calculating remaining time';\n    }\n\n    const\
          \ h =\n      Math.floor(minutes / 60);\n\n    const m =\n      Math.round(minutes % 60);\n\n    if (h\
          \ === 0)\n      return `Full in ${m}m`;\n\n    if (m === 0)\n      return `Full in ${h}h`;\n\n    return\
          \ `Full in ${h}h ${m}m`;\n  };\n\n  const etaText =\n    charging\n      ? formatEta(eta)\n      : discharging\n\
          \        ? (() => {\n            if (soc === null || capacity === null || reserveLevel === null || capacity\
          \ <= 0)\n              return 'Time to reserve unavailable';\n            if (soc <= reserveLevel)\n \
          \             return 'At configured reserve';\n\n            const remainingEnergyKwh =\n            \
          \  capacity * (soc - reserveLevel) / 100;\n            const minutes =\n              remainingEnergyKwh\
          \ * 1000 * 60 * 0.9 / Math.abs(totalPower);\n            if (!Number.isFinite(minutes) || minutes <= 0)\n\
          \              return 'Time to reserve unavailable';\n\n            const rounded = Math.max(1, Math.round(minutes));\n\
          \            const h = Math.floor(rounded / 60);\n            const m = rounded % 60;\n            const\
          \ duration = h === 0\n              ? `${m}m`\n              : m === 0\n                ? `${h}h`\n  \
          \              : `${h}h ${m}m`;\n            return `≈ ${duration} to ${Math.round(reserveLevel)}% reserve`;\n\
          \          })()\n        : 'Not currently charging';\n\n  const stackPower = (p) => {\n\n    if (Math.abs(p)\
          \ < 50)\n      return 'Idle';\n\n    return p > 0\n      ? `${powerText(p)} in`\n      : `${powerText(p)}\
          \ out`;\n  };\n\n  const batteryBar = (\n    level,\n    height = 8\n  ) => `\n    <div style=\"\n   \
          \   position:relative;\n      height:${height}px;\n      border-radius:999px;\n      overflow:hidden;\n\
          \      background:rgba(255,255,255,.09);\n    \">\n\n      <div style=\"\n        position:absolute;\n\
          \        inset:0 auto 0 0;\n        width:${clamp(level)}%;\n        border-radius:999px;\n        background:\n\
          \          linear-gradient(\n            90deg,\n            #29c95a,\n            #41e66f\n         \
          \ );\n        transition:width .5s ease;\n      \">\n      </div>\n\n      <div style=\"\n        position:absolute;\n\
          \        inset:0;\n        background-image:\n          linear-gradient(\n            to right,\n    \
          \        transparent calc(100% - 2px),\n            rgba(17,18,20,.72) 0\n          );\n        background-size:10%\
          \ 100%;\n      \">\n      </div>\n\n    </div>\n  `;\n\n  const stack = (\n    name,\n    battery,\n \
          \   power\n  ) => `\n    <div style=\"\n      background:\n        rgba(255,255,255,.04);\n      border:\n\
          \        1px solid\n        rgba(255,255,255,.07);\n      border-radius:16px;\n      padding:12px;\n \
          \     min-width:0;\n    \">\n\n      <div style=\"\n        display:flex;\n        justify-content:\n\
          \          space-between;\n        align-items:center;\n        margin-bottom:9px;\n      \">\n\n    \
          \    <span style=\"\n          font-size:11px;\n          letter-spacing:.10em;\n          font-weight:750;\n\
          \          color:\n            rgba(255,255,255,.58);\n        \">\n          ${name}\n        </span>\n\
          \n        <ha-icon\n          icon=\"${\n            power > 50\n              ? 'mdi:lightning-bolt'\n\
          \              : power < -50\n                ? 'mdi:home-lightning-bolt-outline'\n                : 'mdi:battery'\n\
          \          }\"\n          style=\"\n            width:15px;\n            color:${\n              Math.abs(power)\
          \ > 50\n                ? flowAccent\n                : 'rgba(255,255,255,.4)'\n            };\n     \
          \     \">\n        </ha-icon>\n\n      </div>\n\n      <div style=\"\n        font-size:24px;\n      \
          \  font-weight:650;\n        color:#fff;\n        margin-bottom:9px;\n      \">\n        ${socText(battery)}\n\
          \      </div>\n\n      ${batteryBar(battery,6)}\n\n      <div style=\"\n        margin-top:8px;\n    \
          \    font-size:10px;\n        color:\n          rgba(255,255,255,.55);\n      \">\n        ${stackPower(power)}\n\
          \      </div>\n\n    </div>\n  `;\n\n  return `\n    <div>\n\n      <div style=\"\n        display:grid;\n\
          \        grid-template-columns:\n          minmax(0,1fr) auto;\n        align-items:start;\n        column-gap:10px;\n\
          \        margin-bottom:17px;\n      \">\n\n        <div style=\"min-width:0;text-align:left;\">\n\n  \
          \        <div style=\"\n            font-size:20px;\n            font-weight:650;\n            color:#fff;\n\
          \            text-align:left;\n            white-space:nowrap;\n          \">\n            Battery Bank\n\
          \          </div>\n\n          <div style=\"\n            margin-top:4px;\n            font-size:11px;\n\
          \            color:\n              rgba(255,255,255,.55);\n            text-align:left;\n          \"\
          >\n            ${bankSubtitle}\n          </div>\n\n        </div>\n\n        <div style=\"\n        \
          \  display:flex;\n          align-items:center;\n          justify-content:center;\n          flex-shrink:0;\n\
          \          white-space:nowrap;\n          gap:5px;\n          padding:6px 9px;\n          border-radius:999px;\n\
          \          background:${flowAccent}18;\n          color:${flowAccent};\n          font-size:10px;\n  \
          \        font-weight:800;\n          letter-spacing:.10em;\n        \">\n\n          <ha-icon\n      \
          \      icon=\"${statusIcon}\"\n            style=\"width:14px;\">\n          </ha-icon>\n\n          ${status}\n\
          \n        </div>\n\n      </div>\n\n      <div style=\"\n        display:grid;\n        grid-template-columns:\n\
          \          1.2fr .8fr;\n        gap:16px;\n        align-items:end;\n        margin-bottom:19px;\n   \
          \   \">\n\n        <div>\n\n          <div style=\"\n            font-size:10px;\n            font-weight:750;\n\
          \            letter-spacing:.12em;\n            color:\n              rgba(255,255,255,.45);\n       \
          \   \">\n            BANK SOC\n          </div>\n\n          <div style=\"\n            margin:4px 0 12px;\n\
          \            font-size:53px;\n            line-height:1;\n            font-weight:560;\n            letter-spacing:-.06em;\n\
          \            color:#fff;\n          \">\n            ${socText(soc)}\n          </div>\n\n          ${batteryBar(soc,10)}\n\
          \n        </div>\n\n        <div>\n\n          <div style=\"\n            font-size:10px;\n          \
          \  font-weight:750;\n            letter-spacing:.11em;\n            color:\n              rgba(255,255,255,.45);\n\
          \          \">\n            ${\n              charging\n                ? 'CHARGE RATE'\n            \
          \    : discharging\n                  ? 'DISCHARGE RATE'\n                  : 'POWER FLOW'\n         \
          \   }\n          </div>\n\n          <div style=\"\n            margin-top:7px;\n            display:flex;\n\
          \            gap:6px;\n            align-items:center;\n          \">\n\n            <ha-icon\n      \
          \        icon=\"${statusIcon}\"\n              style=\"\n                width:20px;\n               \
          \ color:${flowAccent};\n              \">\n            </ha-icon>\n\n            <span style=\"\n    \
          \          font-size:24px;\n              font-weight:600;\n              color:#fff;\n            \"\
          >\n              ${powerText(totalPower)}\n            </span>\n\n          </div>\n\n          <div style=\"\
          \n            margin-top:5px;\n            font-size:11px;\n            color:\n              rgba(255,255,255,.55);\n\
          \          \">\n            ${etaText}\n          </div>\n\n        </div>\n\n      </div>\n\n      <div\
          \ style=\"\n        display:grid;\n        grid-template-columns:\n          repeat(3,minmax(0,1fr));\n\
          \        gap:8px;\n      \">\n        ${stack('AC1',soc1,p1)}\n        ${stack('AC2',soc2,p2)}\n     \
          \   ${stack('AC3',soc3,p3)}\n      </div>\n\n    </div>\n  `;\n]]]\n"
