        {% set days = state_attr(p,''days'') or [] %}

        {% if states(p) == ''conserve'' %}

        **Preserve battery energy during the low-solar days listed below.** Resume household battery use when solar
        returns.

        {% elif states(p) in [''storm'',''storm_sensor_unavailable''] %}

        **{{ state_attr(p,''reason'') }}**

        {% elif states(p) == ''unavailable'' %}

        **Missing planning input:** {{ state_attr(p,''reason'') }}

        {% else %}

        **Use batteries for household demand. Move flexible loads into the windows below.**

        {% endif %}

        {% for d in days %}

        ### {{ d.date }}

        {% if d.status == ''conserve'' %}

        Preserve the battery for the sustained low-solar period.

        {% endif %}

        {% if d.ev_charge_kwh > 0 %}

        **Charge the EV {{ d.ev_charge_kwh | round(1) }} kWh**, {{ d.ev_window_start.split(''T'')[1][:5] }}–{{ d.ev_window_end.split(''T'')[1][:5]
        }}.

        Solar supplies {{ d.ev_direct_solar_kwh | round(1) }} kWh; battery or grid supplies {{ d.ev_battery_or_grid_kwh
        | round(1) }} kWh. This window remains planned while the EV is away.

        {% endif %}

        {% if d.other_load_opportunity_kwh > 0.05 %}

        **Remaining export: {{ d.other_load_opportunity_kwh | round(1) }} kWh.** Schedule other useful loads {{
        d.flex_window_start.split(''T'')[1][:5] }}–{{ d.flex_window_end.split(''T'')[1][:5] }} to absorb it.

        {% if d.ev_return_opportunity_kwh > 0.05 %}

        A later EV return can use up to {{ d.ev_return_opportunity_kwh | round(1) }} kWh of that same opportunity
        as driving creates charge capacity.

        {% endif %}

        {% else %}

        No additional flexible load is needed.

        {% endif %}

        {% endfor %}

        '
